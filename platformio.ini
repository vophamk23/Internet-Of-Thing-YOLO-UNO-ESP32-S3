; Cấu hình PlatformIO cho ESP32 thường và YoloUNO
[platformio]
default_envs = yolo_uno

; 1. Môi trường dành cho ESP32 thường để test trước
[env:esp32_thuong]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM3
monitor_port = COM3
lib_deps = 
    knolleary/PubSubClient@^2.8

; 2. Môi trường gốc dành cho YoloUNO (ESP32-S3)
[env:yolo_uno]
platform = espressif32
board = yolo_uno
framework = arduino
monitor_speed = 115200
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
lib_deps = 
    knolleary/PubSubClient@^2.8
